name: Release

# Publishes copiar to the private update catalog. The version comes from the
# VERSION file: bump it in the commit that should be released. The catalog
# rejects an already published or lower version, so the workflow only runs
# when VERSION changes (or by hand).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build every enabled target
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"; ext=""
            [ "$goos" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/copiar-${goos}-${goarch}${ext}" ./cmd/copiar
          done
      - name: Publish to the update catalog
        env:
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          CATALOG_UPLOAD_TOKEN: ${{ secrets.CATALOG_UPLOAD_TOKEN }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          ./scripts/publish-release.sh copiar-tui "$VERSION" \
            linux/amd64=dist/copiar-linux-amd64 \
            linux/arm64=dist/copiar-linux-arm64 \
            darwin/amd64=dist/copiar-darwin-amd64 \
            darwin/arm64=dist/copiar-darwin-arm64 \
            windows/amd64=dist/copiar-windows-amd64.exe \
            windows/arm64=dist/copiar-windows-arm64.exe
