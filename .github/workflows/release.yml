name: Release

# Publishing a tag (git tag v0.5.0 && git push origin v0.5.0) builds every
# target enabled for copiar-tui in the update catalog and publishes them together.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Must match the targets checked for copiar-tui in the catalog panel:
      # the catalog publishes only when all of them are uploaded.
      TARGETS: linux/amd64 darwin/amd64 darwin/arm64 windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like vMAJOR.MINOR.PATCH, got '${tag}'"
            exit 1
          fi
          version="${tag#v}"
          mkdir -p dist
          for target in $TARGETS; do
            goos="${target%/*}"; goarch="${target#*/}"; ext=""
            [ "$goos" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/copiar_${version}_${goos}_${goarch}${ext}" ./cmd/copiar
          done
          ls -l dist

      - name: Publish to the update catalog
        env:
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          CATALOG_UPLOAD_TOKEN: ${{ secrets.CATALOG_UPLOAD_TOKEN }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          args=()
          for target in $TARGETS; do
            goos="${target%/*}"; goarch="${target#*/}"; ext=""
            [ "$goos" = windows ] && ext=".exe"
            args+=("${target}=dist/copiar_${version}_${goos}_${goarch}${ext}")
          done
          ./scripts/publish-release.sh copiar-tui "$version" "${args[@]}"
